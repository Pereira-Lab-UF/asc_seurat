name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-ubuntu:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: "false"
      RETICULATE_AUTOCONFIGURE: "FALSE"
      RETICULATE_PYTHON: /usr/bin/python3

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          dependencies: '"hard"'
          needs: check

      - name: Run R CMD check
        timeout-minutes: 45
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "warning")
        shell: Rscript {0}

  smoke-macos:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install package and load app
        run: |
          install.packages("pak", repos = "https://cran.r-project.org")
          pak::local_install(dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = FALSE)
          library(ascseurat)
          app_dir <- system.file("app", package = "ascseurat")
          stopifnot(nzchar(app_dir), file.exists(file.path(app_dir, "app.R")))
        shell: Rscript {0}
