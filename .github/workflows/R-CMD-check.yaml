name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-ubuntu:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: "false"
      RETICULATE_AUTOCONFIGURE: "FALSE"
      RETICULATE_PYTHON: /usr/bin/python3

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install Ubuntu system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gfortran \
            git \
            libcurl4-openssl-dev \
            libhdf5-dev \
            libssl-dev \
            libxml2-dev \
            pkg-config

      - name: Pre-install BPCells without pak
        env:
          BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf
        run: |
          cran <- Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest")
          if (!nzchar(cran)) cran <- "https://packagemanager.posit.co/cran/__linux__/noble/latest"
          options(timeout = 600, repos = c(CRAN = cran))
          for (attempt in seq_len(5)) {
            try(install.packages("remotes", repos = getOption("repos")), silent = TRUE)
            if (requireNamespace("remotes", quietly = TRUE)) break
            if (attempt == 5) stop("Failed to install remotes")
            Sys.sleep(15 * attempt)
          }
          remotes::install_github(
            "bnprks/BPCells",
            ref = Sys.getenv("BPCELLS_REF"),
            subdir = "r",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            upgrade = "never"
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
          dependencies: '"hard"'
          needs: check

      - name: Run R CMD check
        timeout-minutes: 45
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "warning")
        shell: Rscript {0}

  smoke-macos:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install macOS system libraries
        run: |
          brew install openssl@3 hdf5 pkg-config
          {
            echo "HDF5_DIR=$(brew --prefix hdf5)"
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix hdf5)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "CPPFLAGS=-I$(brew --prefix openssl@3)/include -I$(brew --prefix hdf5)/include ${CPPFLAGS:-}"
            echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib -L$(brew --prefix hdf5)/lib ${LDFLAGS:-}"
            echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib:$(brew --prefix hdf5)/lib:${LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Install macOS GNU Fortran
        run: |
          curl -L -o "${RUNNER_TEMP}/gfortran.pkg" https://mac.r-project.org/tools/gfortran-14.2-universal.pkg
          sudo installer -pkg "${RUNNER_TEMP}/gfortran.pkg" -target /

      - name: Pre-install BPCells without pak
        env:
          BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf
        run: |
          options(timeout = 600, repos = c(CRAN = "https://cran.rstudio.com"))
          for (attempt in seq_len(5)) {
            try(install.packages("remotes", repos = getOption("repos")), silent = TRUE)
            if (requireNamespace("remotes", quietly = TRUE)) break
            if (attempt == 5) stop("Failed to install remotes")
            Sys.sleep(15 * attempt)
          }
          remotes::install_github(
            "bnprks/BPCells",
            ref = Sys.getenv("BPCELLS_REF"),
            subdir = "r",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            upgrade = "never"
          )
        shell: Rscript {0}

      - name: Install package and load app
        run: |
          options(timeout = 600, repos = c(CRAN = "https://cran.rstudio.com"))
          for (attempt in seq_len(5)) {
            try(install.packages("pak", repos = getOption("repos")), silent = TRUE)
            if (requireNamespace("pak", quietly = TRUE)) break
            if (attempt == 5) stop("Failed to install pak")
            Sys.sleep(15 * attempt)
          }
          pak::local_install(dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = FALSE)
          library(ascseurat)
          app_dir <- system.file("app", package = "ascseurat")
          stopifnot(nzchar(app_dir), file.exists(file.path(app_dir, "app.R")))
        shell: Rscript {0}
