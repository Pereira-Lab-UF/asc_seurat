name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-ubuntu:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install BPCells system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libhdf5-dev pkg-config

      - name: Pre-install BPCells (pak sub-dir remote workaround)
        run: |
          Rscript - <<'EOF'
          lib <- Sys.getenv("R_LIB_FOR_PAK")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          repos <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org")
          install.packages("remotes", lib = lib, repos = repos)
          remotes::install_github(
            "bnprks/BPCells",
            subdir = "r",
            ref = Sys.getenv("BPCELLS_REF"),
            lib = lib,
            upgrade = "never",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            build_vignettes = FALSE
          )
          desc <- utils::packageDescription("BPCells")
          stopifnot(requireNamespace("BPCells", quietly = TRUE))
          stopifnot(identical(desc$RemoteSha, Sys.getenv("BPCELLS_REF")))
          cat("BPCells", as.character(utils::packageVersion("BPCells")), "ready\n")
          EOF

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pak
          needs: check

      - name: Run R CMD check
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "warning")
        shell: Rscript {0}

  smoke-macos:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install BPCells system dependencies
        run: |
          brew install hdf5 pkg-config
          {
            echo "HDF5_DIR=$(brew --prefix hdf5)"
            echo "PKG_CONFIG_PATH=$(brew --prefix hdf5)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Pre-install BPCells (pak sub-dir remote workaround)
        run: |
          Rscript - <<'EOF'
          lib <- Sys.getenv("R_LIB_FOR_PAK")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          repos <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org")
          install.packages("remotes", lib = lib, repos = repos)
          remotes::install_github(
            "bnprks/BPCells",
            subdir = "r",
            ref = Sys.getenv("BPCELLS_REF"),
            lib = lib,
            upgrade = "never",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            build_vignettes = FALSE
          )
          desc <- utils::packageDescription("BPCells")
          stopifnot(requireNamespace("BPCells", quietly = TRUE))
          stopifnot(identical(desc$RemoteSha, Sys.getenv("BPCELLS_REF")))
          cat("BPCells", as.character(utils::packageVersion("BPCells")), "ready\n")
          EOF

      - name: Install package and load app
        run: |
          install.packages("pak", repos = "https://cran.r-project.org")
          pak::local_install(dependencies = TRUE, upgrade = FALSE)
          library(ascseurat)
          app_dir <- system.file("app", package = "ascseurat")
          stopifnot(nzchar(app_dir), file.exists(file.path(app_dir, "app.R")))
        shell: Rscript {0}
