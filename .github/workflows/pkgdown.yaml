name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install BPCells system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libhdf5-dev pkg-config

      - name: Pre-install BPCells (pak sub-dir remote workaround)
        run: |
          Rscript - <<'EOF'
          lib <- Sys.getenv("R_LIB_FOR_PAK")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          repos <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org")
          install.packages("remotes", lib = lib, repos = repos)
          remotes::install_github(
            "bnprks/BPCells",
            subdir = "r",
            ref = Sys.getenv("BPCELLS_REF"),
            lib = lib,
            upgrade = "never",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            build_vignettes = FALSE
          )
          desc <- utils::packageDescription("BPCells")
          stopifnot(requireNamespace("BPCells", quietly = TRUE))
          stopifnot(identical(desc$RemoteSha, Sys.getenv("BPCELLS_REF")))
          cat("BPCells", as.character(utils::packageVersion("BPCells")), "ready\n")
          EOF

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
          needs: website

      - name: Build pkgdown site
        run: |
          unlink("docs/pkgdown", recursive = TRUE)
          pkgdown::build_site()
        shell: Rscript {0}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/pkgdown
