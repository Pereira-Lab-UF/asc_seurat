name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - name: Install Ubuntu system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gfortran \
            git \
            libcurl4-openssl-dev \
            libhdf5-dev \
            libssl-dev \
            libxml2-dev \
            pkg-config

      - name: Pre-install BPCells without pak
        env:
          BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf
        run: |
          options(timeout = 600, repos = c(CRAN = "https://cran.rstudio.com"))
          for (attempt in seq_len(5)) {
            try(install.packages("remotes", repos = getOption("repos")), silent = TRUE)
            if (requireNamespace("remotes", quietly = TRUE)) break
            if (attempt == 5) stop("Failed to install remotes")
            Sys.sleep(15 * attempt)
          }
          remotes::install_github(
            "bnprks/BPCells",
            ref = Sys.getenv("BPCELLS_REF"),
            subdir = "r",
            dependencies = c("Depends", "Imports", "LinkingTo"),
            upgrade = "never"
          )
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
          dependencies: '"hard"'
          needs: website

      - name: Build pkgdown site
        run: |
          unlink("docs/pkgdown", recursive = TRUE)
          pkgdown::build_site()
        shell: Rscript {0}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/pkgdown
