name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure R library
        run: |
          mkdir -p "${RUNNER_TEMP}/Library"
          {
            echo "R_LIB_FOR_PAK=${RUNNER_TEMP}/Library"
            echo "R_LIBS_USER=${RUNNER_TEMP}/Library"
          } >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
          dependencies: '"hard"'
          needs: website

      - name: Build pkgdown site
        run: |
          unlink("docs/pkgdown", recursive = TRUE)
          pkgdown::build_site()
        shell: Rscript {0}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/pkgdown
