name: pkgdown

on:
  push:
    branches: [main]

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BPCELLS_REF: adc4a3c30f60a03522f58947d733d7d77a6eb2cf
      R_LIB_FOR_PAK: ${{ runner.temp }}/Library
      R_LIBS_USER: ${{ runner.temp }}/Library

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install BPCells system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libhdf5-dev pkg-config

      - name: Pre-install BPCells (pak sub-dir remote workaround)
        run: |
          Rscript -e 'lib <- Sys.getenv("R_LIB_FOR_PAK"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); repos <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org"); install.packages(c("Rcpp", "RcppEigen", "magrittr", "rlang", "vctrs", "lifecycle", "stringr", "tibble", "dplyr", "tidyr", "readr", "ggplot2", "scales", "patchwork", "scattermore", "ggrepel", "RColorBrewer", "hexbin"), lib = lib, repos = repos, dependencies = c("Depends", "Imports", "LinkingTo"))'
          git init /tmp/BPCells
          cd /tmp/BPCells
          git remote add origin https://github.com/bnprks/BPCells.git
          git fetch --depth 1 origin "${BPCELLS_REF}"
          git checkout --detach FETCH_HEAD
          R CMD INSTALL --library="${R_LIB_FOR_PAK}" r
          Rscript -e 'lib <- Sys.getenv("R_LIB_FOR_PAK"); .libPaths(c(lib, .libPaths())); stopifnot(requireNamespace("BPCells", quietly = TRUE)); cat("BPCells", as.character(utils::packageVersion("BPCells")), "ready\n")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
          needs: website

      - name: Build pkgdown site
        run: |
          unlink("docs/pkgdown", recursive = TRUE)
          pkgdown::build_site()
        shell: Rscript {0}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/pkgdown
