name: docker-build

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the image to Docker Hub after the build and smoke test'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

env:
  IMAGE_NAME: pereiralabbio/asc-seurat

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=3,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Validate build configuration
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          call: check

      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ascseurat-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime smoke test
        run: |
          docker rm -f ascseurat-ci 2>/dev/null || true
          docker run -d --rm --name ascseurat-ci -p 3838:3838 ascseurat-ci:${{ github.sha }}
          trap 'docker kill ascseurat-ci 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3838 > /tmp/ascseurat.html; then
              break
            fi
            sleep 2
          done
          grep -q "Asc-Seurat v3" /tmp/ascseurat.html

      - name: Check Docker Hub credentials
        id: dockerhub
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub secrets are not configured, so the image build was tested but not pushed."
          fi

      - uses: docker/login-action@v4
        if: steps.dockerhub.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push release image
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
