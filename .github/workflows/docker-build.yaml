name: docker-build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ascseurat-ci:${{ github.sha }}

      - name: Runtime smoke test
        run: |
          docker run -d --rm --name ascseurat-ci -p 3838:3838 ascseurat-ci:${{ github.sha }}
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3838 > /tmp/ascseurat.html; then
              break
            fi
            sleep 2
          done
          grep -q "Asc-Seurat v3" /tmp/ascseurat.html
          docker kill ascseurat-ci

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push release image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            kirstlab/asc_seurat:latest
            kirstlab/asc_seurat:${{ github.ref_name }}
